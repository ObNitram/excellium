name: excellium_storage_drift
description: >-
  Implémentation SQLite (Drift) des interfaces de stockage d'excellium_core.
  C'est le seul paquet qui connaît Drift.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  drift: ^2.35.4
  excellium_core:
    path: ../excellium_core

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  excellium_store_contract:
    path: ../excellium_store_contract
  lints: ^6.1.0
  test: ^1.25.0
